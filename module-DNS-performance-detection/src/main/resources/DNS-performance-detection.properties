#watermark设置
flink.watermark.max.orderness=10

#默认窗口大小
flink.window.max.time=300

#判定检测阈值范围
dns.error.detection.info.threshold=0.1
dns.error.detection.low.threshold=0.2
dns.error.detection.medium.threshold=0.3
dns.error.detection.high.threshold=0.4
dns.error.detection.critical.threshold=0.5

dns.response.detection.info.threshold=2
dns.response.detection.low.threshold=2.5
dns.response.detection.medium.threshold=3
dns.response.detection.high.threshold=5
dns.response.detection.critical.threshold=8

http.error.detection.info.threshold=0.1
http.error.detection.low.threshold=0.2
http.error.detection.medium.threshold=0.3
http.error.detection.high.threshold=0.4
http.error.detection.critical.threshold=0.5

#每次写入ES条数
bulk.flush.max.action=1000

#detection performance表名
#es.performance.table.name=performance_event
es.performance.table.name=test

#检测所需并行度
performance.detection.parallelism=1

#计算response.detection阈值使用的时间粒度的个数N
dns.response.detection.time.count=1
