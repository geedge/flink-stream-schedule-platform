#窗口时间，单位为分钟
flink.window.time=5
#end_time时间,单位秒
end.time=300
#watermark时间，单位为分钟
flink.watermark.max.time=5
#数据flush至es
es.max.flush=1000

#安全检测插件算子并行度
#安全检测插件source并行度
security.source.parallelism=1
#安全检测插件server窗口并行度
security.server.parallelism=1
#安全检测插件domain窗口并行度
security.domain.parallelism=1
#安全检测插件url窗口并行度
security.url.parallelism=1

#slot隔离名称，默认default，default用于本地调试使用
security.server.slot.name=default
security.domain.slot.name=default
security.url.slot.name=default

#es.security.table.name=security_event
es.security.table.name=test1