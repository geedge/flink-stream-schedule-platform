#watermark，默认10s
top.metrics.max.orderness=10

#topN 统计窗口大小，默认：60s
top.metrics.window.time=60

#保留小数位数，默认4位
top.metrics.round.scale=4

#topN数量，默认：100条
top.metrics.rownum.limit=100

#是否使用default slotSharingGroup,0：使用默认，1：不使用默认
top.default.slotSharingGroup.type=0

#计算topN所需并行度
top.metric.parallelism=1
