############################## Flink checkpoint 配置 ######################################
#是否开启checkpoint,0:不开启;1:开启
flink.enable.checkpoint.flag=0

#开启一次 checkpoint 粒度,单位:s
flink.enable.checkpoint.time=300

#两个 checkpoint 之间等待的时间,单位:s
flink.min.pause.between.checkpoints=60

#单次 checkpoint 超时时间,单位:s
flink.checkpoint.timeout=120

#允许两个连续的 checkpoint 错误
flink.tolerable.checkpoint.failure.number=2

#同一时间只允许一个 checkpoint 进行
flink.max.concurrent.checkpoint=1

############################## Flink-Kafka 生产者配置 ######################################
#producer重试的次数设置
kafka.producer.retries=0

#他的含义就是说一个Batch被创建之后，最多过多久，不管这个Batch有没有写满，都必须发送出去了
kafka.producer.linger.ms=10

#如果在超时之前未收到响应，客户端将在必要时重新发送请求
kafka.producer.request.timeout.ms=30000

#producer都是按照batch进行发送的,批次大小，默认:16384
kafka.producer.batch.size=262144

#Producer端用于缓存消息的缓冲区大小
#128M
kafka.producer.buffer.memory=134217728

#这个参数决定了每次发送给Kafka服务器请求的最大大小,默认1048576
#10M
kafka.producer.max.request.size=10485760

#开启kafka压缩类型，默认不开启
kafka.producer.compression.type=none

#common_app_label字段是否为第三方APP识别结果，0：是，1：否，默认是0
app.label.is.third=0

