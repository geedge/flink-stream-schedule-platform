############################## Flink checkpoint 配置 ######################################
#开启一次 checkpoint 粒度,单位:ms
flink.enable.checkpoint=1000

#两个 checkpoint 之间等待的时间,单位:ms
flink.min.pause.between.checkpoints=500

#单次 checkpoint 超时时间,单位:ms
flink.checkpoint.timeout=60000

#允许两个连续的 checkpoint 错误
flink.tolerable.checkpoint.failure.number=2

#同一时间只允许一个 checkpoint 进行
flink.max.concurrent.checkpoint=1